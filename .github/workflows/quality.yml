name: Astro quality
on:
  push:
    branches: [main, redesign/astro-cms]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mgbc-dist
          path: dist
